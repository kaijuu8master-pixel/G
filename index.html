<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم الأسماء</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 70%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 30px;
            padding: 15px;
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            text-align: right;
            font-size: 18px;
        }
        .name-highlight {
            font-weight: bold;
            color: #00796b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ مترجم الأسماء: اكتشف المعنى</h1>
        <p>أدخل الاسم باللغة العربية واضغط على زر البحث:</p>

        <input type="text" id="nameInput" placeholder="أدخل الاسم هنا..." value="">
        <button onclick="translateName()">بحث عن المعنى 🔍</button>

        <div id="result">
            النتائج ستظهر في هذا المكان...
        </div>
    </div>

    <script>
        // 1. قاعدة البيانات (القاموس) باستخدام JavaScript Object
        const dictionaryOfNames = {
            "محمد": "المحمود والمشكور، كثير الخصال الحميدة.",
            "سارة": "الأميرة، السيدة، المفرحة.",
            "خالد": "الدائم والباقي، الذي طال عمره.",
            "نور": "الضوء والإشراق، البصيرة والهداية.",
            "علي": "الشريف، الرفيع، العالي المكانة.",
            "مريم": "العابدة، خادمة الرب.",
            "يوسف": "الزيادة والعطاء، الذي يمنحه الله."
        };

        function translateName() {
            // 2. استقبال المدخلات وتنظيفها
            const nameInput = document.getElementById('nameInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (nameInput === "") {
                resultDiv.innerHTML = '⚠️ **الرجاء إدخال اسم للبحث.**';
                return;
            }

            // 3. البحث في القاموس
            // يتم البحث بدون الحساسية لحالة الأحرف باستخدام nameInput (هنا باللغة العربية، لا نحتاج لتحويل كبير/صغير)
            const meaning = dictionaryOfNames[nameInput];

            // 4. إخراج النتيجة في عنصر HTML
            if (meaning) {
                resultDiv.innerHTML = `
                    <p>
                        <span class="name-highlight">الاسم: ${nameInput}</span>
                    </p>
                    <p>
                        <span class="name-highlight">المعنى:</span> ${meaning}
                    </p>
                `;
            } else {
                resultDiv.innerHTML = `
                    <p style="color: red;">
                        ❌ عفواً، لا يوجد معنى للاسم <span class="name-highlight">'${nameInput}'</span> في قاعدة البيانات الحالية.
                    </p>
                `;
            }
        }
    </script>

</body>
</html>
