<script>
        // 1. قاعدة البيانات (القاموس) باستخدام JavaScript Object
        const dictionaryOfNames = {
            "محمد": "المحمود والمشكور، كثير الخصال الحميدة.",
            "سارة": "الأميرة، السيدة، المفرحة.",
            "خالد": "الدائم والباقي، الذي طال عمره.",
            "نور": "الضوء والإشراق، البصيرة والهداية.",
            "علي": "الشريف، الرفيع، العالي المكانة.",
            "مريم": "العابدة، خادمة الرب.",
            "يوسف": "الزيادة والعطاء، الذي يمنحه الله."
        };

        // دالة للمساعدة في تنظيف النص ومعالجة الاختلافات الشائعة في الإدخال العربي
        function normalizeArabic(text) {
            if (!text) return '';
            // 1. إزالة أي مسافات زائدة
            let normalized = text.trim();
            // 2. توحيد الهمزات والألفات (أ, إ, آ, ا) إلى (ا)
            normalized = normalized.replace(/[أإآ]/g, 'ا');
            // 3. توحيد الياء (ي, ى) إلى (ي)
            normalized = normalized.replace(/ى/g, 'ي');
            // 4. توحيد التاء المربوطة (ة) إلى (ت) للبحث (لأن الكثيرين قد يكتبونها هاء 'هـ')
            normalized = normalized.replace(/ة/g, 'ت');
            // 5. توحيد حرف الهاء في آخر الكلمة
            normalized = normalized.replace(/ه$/g, 'ت');

            return normalized;
        }

        function translateName() {
            // 2. استقبال المدخلات وتنظيفها
            const nameInput = document.getElementById('nameInput').value;
            const resultDiv = document.getElementById('result');
            
            // تنظيف المدخلات للقاعدة
            const cleanedInput = normalizeArabic(nameInput);
            
            // التحقق من أن الحقل ليس فارغًا بعد التنظيف
            if (cleanedInput === "") {
                resultDiv.innerHTML = '⚠️ **الرجاء إدخال اسم للبحث.**';
                return;
            }

            let meaning = null;
            let foundName = null;

            // 3. البحث في القاموس عن طريق تنظيف مفاتيح القاموس أيضاً
            for (const key in dictionaryOfNames) {
                if (normalizeArabic(key) === cleanedInput) {
                    meaning = dictionaryOfNames[key];
                    foundName = key; // لحفظ الاسم الأصلي كما هو في القاموس
                    break;
                }
            }


            // 4. إخراج النتيجة في عنصر HTML
            if (meaning) {
                resultDiv.innerHTML = `
                    <p>
                        <span class="name-highlight">الاسم: ${foundName}</span>
                    </p>
                    <p>
                        <span class="name-highlight">المعنى:</span> ${meaning}
                    </p>
                `;
            } else {
                resultDiv.innerHTML = `
                    <p style="color: red;">
                        ❌ عفواً، لا يوجد معنى للاسم <span class="name-highlight">'${nameInput}'</span> في قاعدة البيانات الحالية.
                    </p>
                `;
            }
        }
    </script>
